<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App Bridge Sample</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { font-size: 18px; margin-bottom: 16px; }
        .status {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: 500;
        }
        .status.disconnected { background: #fee; color: #c00; }
        .status.connected { background: #efe; color: #060; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        button {
            padding: 12px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #0066cc;
            color: #fff;
            transition: background 0.15s;
        }
        button:hover { background: #0052a3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        .log {
            margin-top: 20px;
            padding: 10px;
            background: #1e1e1e;
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            border-radius: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log p { margin: 2px 0; }
        #receiptContainer { margin-top: 16px; }
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: #fff;
            border-radius: 6px 6px 0 0;
            border-bottom: 2px solid #0066cc;
            font-size: 13px;
        }
        .receipt-header strong { font-size: 14px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            overflow: hidden;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        th { background: #0066cc; color: #fff; }
        td.num { text-align: right; }
        th.num { text-align: right; }
        tr:last-child td { border-bottom: none; }
        .receipt-footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 12px;
            background: #fff;
            border-top: 2px solid #0066cc;
            border-radius: 0 0 6px 6px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
<h1>Iframe Web App</h1>
<div id="status" class="status disconnected">⏳ Waiting for POS bridge...</div>

<div class="actions">
    <button id="btnMessage" disabled onclick="sendMessage()">Show Message on POS</button>
    <button id="btnSalesItem" disabled onclick="addSalesItem()">Add SalesItem</button>
    <button id="btnReceipt" disabled onclick="fetchReceipt()">Fetch Receipt</button>
</div>

<div id="receiptContainer"></div>

<div id="log" class="log"></div>

<!-- Include the SDK -->
<script src="PluginServlet?action=posBridgeSdk"></script>

<script>
    const pos = new POSBridge();

    function log(text) {
        const el = document.getElementById('log');
        const p = document.createElement('p');
        p.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        el.appendChild(p);
        el.scrollTop = el.scrollHeight;
    }

    // Wait for bridge, then enable UI
    pos.ready().then(() => {
        document.getElementById('status').className = 'status connected';
        document.getElementById('status').textContent = '✅ Connected to POS';
        document.querySelectorAll('button').forEach(b => b.disabled = false);
        log('Bridge ready');
    });

    // Example event listener (will fire once plugin pushes receiptChanged events)
    pos.on('receiptChanged', (receipt) => {
        log('Receipt changed event received');
        renderReceipt(receipt);
    });

    async function fetchReceipt() {
        try {
            log('Fetching receipt...');
            const receipt = await pos.getReceipt();
            log('Receipt received');
            renderReceipt(receipt);
        } catch (e) {
            log(`Error: ${e.message}`);
        }
    }

    function sendMessage() {
        pos.pushEvent('SHOW_MESSAGE', 'Hello from the iframe app!');
        log('Sent SHOW_MESSAGE');
    }

    function addSalesItem() {
        pos.pushEvent('SALESITEM_ADD', {
                materialId: 'JAC.49000',
                quantity: 1,
                split: true
            });
    }

    function formatCurrency(amount, currency) {
        return new Intl.NumberFormat('de-DE', {
            style: 'currency',
            currency: currency || 'EUR'
        }).format(amount);
    }

    function renderReceipt(receipt) {
        const container = document.getElementById('receiptContainer');
        const currency = receipt.currency || 'EUR';

        if (!receipt || !receipt.salesItems || receipt.salesItems.length === 0) {
            container.innerHTML = '<p style="padding:16px; color:#666;">No items on receipt.</p>';
            return;
        }

        let html = `
            <div class="receipt-header">
                <strong>Receipt ${receipt.id || ''}</strong>
                <span>${new Date(receipt.businessTransactionDate).toLocaleString('de-DE')}</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Item</th>
                        <th class="num">Qty</th>
                        <th class="num">Unit Price</th>
                        <th class="num">Tax %</th>
                        <th class="num">Total</th>
                    </tr>
                </thead>
                <tbody>`;

        receipt.salesItems.forEach((item, index) => {
            html += `<tr>
                <td>${index + 1}</td>
                <td>${item.description || item.id || '—'}</td>
                <td class="num">${item.quantity ?? ''} ${item.quantityTypeCodeName || ''}</td>
                <td class="num">${formatCurrency(item.unitGrossAmount, currency)}</td>
                <td class="num">${(item.taxRate * 100).toFixed(0)}%</td>
                <td class="num">${formatCurrency(item.grossAmount, currency)}</td>
            </tr>`;
        });

        html += `</tbody></table>
            <div class="receipt-footer">
                <span>Net: ${formatCurrency(receipt.totalNetAmount, currency)} | Tax: ${formatCurrency(receipt.totalTaxAmount, currency)}</span>
                <span>Total: ${formatCurrency(receipt.totalGrossAmount, currency)}</span>
            </div>`;

        container.innerHTML = html;
        log(`Rendered ${receipt.salesItems.length} item(s), total: ${formatCurrency(receipt.totalGrossAmount, currency)}`);
    }
</script>
</body>
</html>
