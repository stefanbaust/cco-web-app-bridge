<div class="embedded">
  <div class="buttons">
    <button [disabled]="!connected()" (click)="sendMessage()">Message</button>
    <button [disabled]="!connected()" (click)="openPopup()">Popup</button>
  </div>
  @if (selectedItem(); as selectedItem) {
    <div class="selectedItem">
      {{ selectedItem.description }}: {{ formatCurrency(selectedItem.paymentGrossAmount) }}
    </div>
  }
  @if (totalGrossAmount() !== null) {
    <div class="total">
      Total: {{ formatCurrency(totalGrossAmount()!) }}
    </div>
  }
</div>
