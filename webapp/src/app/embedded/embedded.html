<div class="embedded">
  <button [disabled]="!connected()" (click)="sendMessage()">Show Message</button>
  <button [disabled]="!connected()" (click)="openPopup()">Open Popup</button>
  @if (selectedItem(); as selectedItem) {
    <div class="selectedItem">
      Current Item: {{ selectedItem.description }}
    </div>
  }
  @if (totalGrossAmount() !== null) {
    <div class="total">
      Total: {{ formatCurrency(totalGrossAmount()!) }}
    </div>
  }
</div>
