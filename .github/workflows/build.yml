name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_REPO_USERNAME: ${{ secrets.MAVEN_REPO_USERNAME }}
      MAVEN_REPO_PASSWORD: ${{ secrets.MAVEN_REPO_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # full history for accurate SonarQube Cloud new-code detection
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and verify
        run: mvn verify -s .mvn/settings.xml

      - name: SonarQube Cloud analysis
        # secrets are empty on PRs from forks and while SONAR_TOKEN is not configured yet — skip then
        if: env.SONAR_TOKEN != ''
        run: >-
          mvn -B -s .mvn/settings.xml
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=stefanbaust
          -Dsonar.projectKey=stefanbaust_cco-web-app-bridge
